name: Bug
description: Something is counted wrong, breaks, or doesn't install
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest setup that shows it. For a wrong browser or channel, paste the user-agent or referrer.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "@konsfyi/analytics 0.1.0, Next 16, Node 22"
  - type: dropdown
    id: store
    attributes:
      label: Store
      options: [File, Neon, Postgres (pg), Your own]
